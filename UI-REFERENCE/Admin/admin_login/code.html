<!DOCTYPE html>

<html lang="id" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - Preloved &amp; Thrift Fashion</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Playfair+Display:ital,wght@0,500;0,600;1,400&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coconut: '#F2F1EA',
            graphite: '#302E2F',
            stone: '#DAD5CF',
            terracotta: '#A34836',
            sage: '#5B7553',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    };
  </script>
<style>
    :root {
      --bg-color: #F2F1EA;
      --text-main: #302E2F;
      --border-subtle: #DAD5CF;
    }

    body {
      background-color: #F2F1EA;
      color: #302E2F;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    /* Tactile Neumorphic Subtle Shadows calibrated specifically to #F2F1EA */
    .neu-card {
      background: #F2F1EA;
      box-shadow: 
        12px 12px 28px rgba(48, 46, 47, 0.07),
        -10px -10px 24px rgba(255, 255, 255, 0.9),
        0 1px 3px rgba(48, 46, 47, 0.04);
      border: 1px solid rgba(218, 213, 207, 0.6);
    }

    /* Subtle recessed / inset field */
    .neu-inset {
      background: #EFECE4;
      box-shadow: 
        inset 2px 2px 5px rgba(48, 46, 47, 0.06),
        inset -2px -2px 5px rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(218, 213, 207, 0.85);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .neu-inset:focus-within {
      background: #ECE9DF;
      border-color: #302E2F;
      box-shadow: 
        inset 2px 2px 6px rgba(48, 46, 47, 0.1),
        inset -2px -2px 6px rgba(255, 255, 255, 0.95);
    }

    /* Tactile subtle raised button */
    .neu-btn-primary {
      background: #302E2F;
      color: #F2F1EA;
      box-shadow: 
        4px 5px 14px rgba(48, 46, 47, 0.22),
        -2px -2px 8px rgba(255, 255, 255, 0.7);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .neu-btn-primary:hover {
      background: #252324;
      transform: translateY(-1px);
      box-shadow: 
        5px 7px 18px rgba(48, 46, 47, 0.26),
        -2px -2px 10px rgba(255, 255, 255, 0.8);
    }

    .neu-btn-primary:active {
      transform: translateY(1px);
      box-shadow: 
        inset 1px 2px 4px rgba(0, 0, 0, 0.3),
        1px 2px 4px rgba(48, 46, 47, 0.15);
    }

    /* Small badge tactile pill */
    .neu-badge {
      background: #F2F1EA;
      box-shadow: 
        2px 2px 5px rgba(48, 46, 47, 0.06),
        -2px -2px 5px rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(218, 213, 207, 0.7);
    }

    /* Restrained error notification pill */
    .neu-error-box {
      background: #F4EFEA;
      border: 1px solid rgba(163, 72, 54, 0.3);
      box-shadow: 
        inset 1px 1px 3px rgba(163, 72, 54, 0.08),
        inset -1px -1px 3px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body class="bg-coconut text-graphite min-h-screen flex flex-col justify-between p-4 sm:p-8 selection:bg-stone selection:text-graphite">
<!-- Minimal Brand Header / Context bar -->
<header class="w-full max-w-6xl mx-auto flex items-center justify-between py-2">
<div class="flex items-center gap-3">
<!-- Monogram Mark -->
<div class="w-8 h-8 rounded-lg neu-badge flex items-center justify-center font-serif text-sm font-semibold tracking-tight text-graphite">
        TF
      </div>
<div>
<span class="text-xs uppercase tracking-widest font-semibold text-graphite/60">Thrift Fashion Studio</span>
<span class="mx-1.5 text-graphite/30 text-xs">/</span>
<span class="text-xs font-medium text-graphite/80">E-Commerce System</span>
</div>
</div>
<!-- Security indicator -->
</header>
<!-- Main Login Card Area -->
<main class="w-full flex-1 flex items-center justify-center py-10 sm:py-14 px-2">
<div class="w-full max-w-[440px]">
<!-- Central Tactile Neumorphic Container -->
<div class="neu-card rounded-2xl p-7 sm:p-9 relative">
<!-- Header info inside card -->
<div class="mb-7 text-left"><div class="flex items-center gap-2 mb-3"><div class="w-6 h-6 rounded neu-badge flex items-center justify-center font-serif text-xs font-semibold text-graphite">TF</div><span class="text-xs uppercase tracking-widest font-semibold text-graphite/60">Thrift Fashion Studio</span></div><h1 class="text-2xl font-bold tracking-tight text-graphite font-sans">Admin Login</h1><p class="text-xs sm:text-sm text-graphite/65 mt-1 leading-relaxed">Masuk ke panel administrasi toko preloved.</p></div>
<!-- Feedback Alert Placeholder (Subtle & Restrained) -->
<div class="hidden mb-6 p-3 rounded-lg neu-error-box flex items-start gap-2.5 text-terracotta" id="alertBox">
<svg class="w-4 h-4 mt-0.5 shrink-0 opacity-90" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<div class="text-xs leading-normal">
<span class="font-semibold block" id="alertTitle">Autentikasi Gagal</span>
<span class="text-terracotta/90" id="alertDesc">Username atau password yang dimasukkan tidak sesuai.</span>
</div>
</div>
<!-- Login Form -->
<form class="space-y-5" id="adminLoginForm" onsubmit="handleAdminLogin(event)">
<!-- Username Input Field -->
<div><label class="block text-xs font-semibold text-graphite tracking-tight mb-1.5" for="username">Username</label><div class="neu-inset rounded-xl flex items-center px-3.5 py-2.5"><svg class="w-4 h-4 text-graphite/40 mr-2.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg><input autocomplete="username" class="w-full bg-transparent border-0 text-sm text-graphite placeholder:text-graphite/35 focus:outline-none focus:ring-0 font-medium" id="username" name="username" placeholder="Masukkan username" required="" type="text"/></div></div>
<!-- Password Input Field -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-xs font-semibold text-graphite tracking-tight" for="password">
                Password
              </label>
</div>
<div class="neu-inset rounded-xl flex items-center px-3.5 py-2.5">
<svg class="w-4 h-4 text-graphite/40 mr-2.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<input autocomplete="current-password" class="w-full bg-transparent border-0 text-sm text-graphite placeholder:text-graphite/35 focus:outline-none focus:ring-0 font-medium" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<!-- Visibility Toggle -->
<button aria-label="Lihat password" class="text-graphite/40 hover:text-graphite/80 transition-colors p-1 focus:outline-none" id="togglePassword" onclick="togglePasswordVisibility()" type="button">
<svg class="w-4 h-4" fill="none" id="eyeIcon" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<svg class="w-4 h-4 hidden" fill="none" id="eyeSlashIcon" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Subtle System Constraint Note (No Forgot Password / Single Owner) -->
<!-- Primary Submit Action -->
<div class="pt-2">
<button class="w-full neu-btn-primary py-3 px-4 rounded-xl font-medium text-sm flex items-center justify-center gap-2 tracking-tight group" id="submitButton" type="submit">
<span class="">Masuk ke Admin Panel</span>
<svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5 opacity-85" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</form>
<!-- Functional Scope Preview (Strict 4 Areas from PRD) -->
</div>
<!-- Demo State Toggles for Reviewer / Evaluation -->
</div>
</main>
<!-- Footer Information -->
<script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeSlashIcon = document.getElementById('eyeSlashIcon');
      
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.classList.add('hidden');
        eyeSlashIcon.classList.remove('hidden');
      } else {
        pwdInput.type = 'password';
        eyeIcon.classList.remove('hidden');
        eyeSlashIcon.classList.add('hidden');
      }
    }

    function handleAdminLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitButton');
      const alertBox = document.getElementById('alertBox');

      // Realistic mock validation for single-seller thrift store admin
      btn.disabled = true;
      btn.classList.add('opacity-80');
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-coconut" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Memverifikasi Kredensial...</span>
      `;

      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove('opacity-80');
        btn.innerHTML = `
          <span>Masuk ke Admin Panel</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        `;

        if (username.toLowerCase() === 'admin' && password === 'admin123') {
          alertBox.classList.remove('hidden', 'text-terracotta', 'neu-error-box');
          alertBox.classList.add('text-sage', 'neu-badge');
          document.getElementById('alertTitle').textContent = 'Autentikasi Berhasil';
          document.getElementById('alertDesc').textContent = 'Mengarahkan ke modul Produk...';
        } else {
          alertBox.classList.remove('hidden');
          document.getElementById('alertTitle').textContent = 'Autentikasi Gagal';
          document.getElementById('alertDesc').textContent = 'Username atau password admin tidak valid. Silakan periksa kembali.';
        }
      }, 700);
    }

    function simulateError() {
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('hidden');
      alertBox.classList.remove('text-sage', 'neu-badge');
      alertBox.classList.add('text-terracotta', 'neu-error-box');
      document.getElementById('alertTitle').textContent = 'Autentikasi Gagal';
      document.getElementById('alertDesc').textContent = 'Username atau password yang dimasukkan tidak cocok dengan basis data admin.';
      document.getElementById('username').focus();
    }

    function resetState() {
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.add('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }
  </script>
</body></html>
